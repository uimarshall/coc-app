# =============================================================================
# docker-compose.prod.yml — PRODUCTION DEPLOYMENT (Hostinger VPS)
#
# This file is used on the server to run the production Docker image.
# The image is pulled from GitHub Container Registry (ghcr.io).
#
# Usage on the VPS:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
# =============================================================================

services:
  # ── Next.js application ────────────────────────────────────────────────────
  app:
    # Pull the pre-built image from GitHub Container Registry
    # The CI/CD pipeline pushes new images here on every merge to master
    image: ghcr.io/${GITHUB_REPOSITORY}:latest

    container_name: coc-app-prod

    # Only expose to localhost — Nginx will proxy traffic from port 80/443
    # to this port. Never expose port 3000 directly to the internet.
    ports:
      - "127.0.0.1:3000:3000"

    # Read environment variables from the /opt/coc-app/.env file on the VPS
    env_file:
      - .env

    environment:
      NODE_ENV: production

    # Docker restart policy — restart the container automatically if it crashes
    # or if the server reboots
    restart: always

    # Health check — Docker will restart the container if this fails
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits — prevent a single container from using all server resources
    deploy:
      resources:
        limits:
          memory: 512M   # Adjust based on your VPS plan
          cpus: "1.0"
