# =============================================================================
# Nginx configuration for the Church of Christ Huddersfield website
#
# This configuration:
#  1. Redirects all HTTP (port 80) traffic to HTTPS (port 443)
#  2. Serves the Next.js app over HTTPS with SSL certificates from Let's Encrypt
#  3. Works behind Cloudflare CDN (which terminates the outer TLS)
#  4. Sets security headers to protect against common web attacks
#
# File location on the VPS: /etc/nginx/sites-available/coc-app
# Enable with: sudo ln -s /etc/nginx/sites-available/coc-app /etc/nginx/sites-enabled/
# Test config:  sudo nginx -t
# Reload:       sudo systemctl reload nginx
# =============================================================================

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain name
    server_name yourchurch.com www.yourchurch.com;

    # Let's Encrypt renewal path — must remain accessible over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server block ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Replace with your actual domain name
    server_name yourchurch.com www.yourchurch.com;

    # ── SSL certificates (issued by Certbot / Let's Encrypt) ─────────────────
    # These paths are created automatically by: sudo certbot --nginx -d yourchurch.com
    ssl_certificate     /etc/letsencrypt/live/yourchurch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourchurch.com/privkey.pem;

    # Let's Encrypt recommended SSL options (auto-updated by Certbot)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Cloudflare IP allowlist ───────────────────────────────────────────────
    # If you use Cloudflare, you can restrict direct VPS access to Cloudflare
    # IPs only. This hides your server's real IP from attackers.
    # Uncomment and keep the IP list up to date from: https://www.cloudflare.com/ips/
    #
    # allow 173.245.48.0/20;
    # allow 103.21.244.0/22;
    # allow 103.22.200.0/22;
    # allow 103.31.4.0/22;
    # allow 141.101.64.0/18;
    # allow 108.162.192.0/18;
    # allow 190.93.240.0/20;
    # allow 188.114.96.0/20;
    # allow 197.234.240.0/22;
    # allow 198.41.128.0/17;
    # allow 162.158.0.0/15;
    # allow 104.16.0.0/13;
    # allow 104.24.0.0/14;
    # allow 172.64.0.0/13;
    # allow 131.0.72.0/22;
    # deny all;

    # ── Security headers ──────────────────────────────────────────────────────
    # These headers protect visitors from common attacks.

    # Prevent browsers from sniffing the MIME type
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent the site from being embedded in an iframe (clickjacking protection)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Enable browser's built-in XSS filter
    add_header X-XSS-Protection "1; mode=block" always;

    # Tell browsers to only use HTTPS for 1 year (HSTS)
    # WARNING: Only enable this once you are sure your SSL works correctly!
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Referrer policy — don't leak the full URL when navigating away
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy — disable features you don't use
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/coc-app.access.log;
    error_log  /var/log/nginx/coc-app.error.log;

    # ── Static file caching ───────────────────────────────────────────────────
    # Next.js static assets have content-hashed names, so they can be cached
    # for a long time without worrying about stale files.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        # Cache for 1 year — Next.js adds a new hash when content changes
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400"; # 1 day
    }

    # ── Proxy all other requests to the Next.js container ────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;

        # Pass the real client IP and host info to Next.js
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (needed for Next.js HMR in dev, kept for safety)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts — increase if your server takes a long time to respond
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Buffer settings — adjust for large response bodies
        proxy_buffering           on;
        proxy_buffer_size         16k;
        proxy_buffers             8 16k;
    }

    # ── Max upload size (for future file uploads via the CMS) ─────────────────
    client_max_body_size 20M;
}
